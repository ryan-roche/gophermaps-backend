version: 0.0

os: linux

files:
  - source: /app
    destination: /var/gophermaps/app
  - source: /pyproject.toml
    destination: /var/gophermaps
  
hooks:
  ApplicationStop:
    - location: scripts/stop-server.sh
  AfterInstall:
    - location: scripts/update-packages.sh
  ApplicationStart:
    - location: scripts/start-server.sh
  ValidateService:
    - location: scripts/validate-service.sh
